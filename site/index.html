<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lodepass - mining pass for .ai agents</title>
<style>
  :root { --ink:#e8e6e1; --dim:#8b929c; --line:#232a33; --gold:#f5c76a; --bg:#0b0e11; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font:15px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
         display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
  .card { width:min(560px,100%); border:1px solid var(--line); border-radius:18px; padding:26px; background:#0f1318; }
  h1 { font-size:20px; letter-spacing:.18em; text-transform:uppercase; }
  .sub { color:var(--dim); font-size:12.5px; margin-top:6px; letter-spacing:.04em; }
  .row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .row b { color:var(--gold); font-weight:600; }
  .art { display:grid; place-items:center; margin:18px 0; }
  .art img { width:180px; height:180px; border-radius:14px; border:1px solid var(--line); }
  button { width:100%; margin-top:16px; padding:13px; border-radius:12px; border:1px solid var(--gold);
           background:transparent; color:var(--gold); font:inherit; letter-spacing:.08em; cursor:pointer; }
  button:hover { background:rgba(245,199,106,.08); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .msg { margin-top:12px; font-size:12.5px; color:var(--dim); min-height:18px; word-break:break-all; }
  a { color:var(--gold); }
</style>
</head>
<body>
<div class="card">
  <h1>Lodepass</h1>
  <div class="sub">On-chain mining pass · mint is limited to Binance Agent ID (.ai) holders</div>

  <div class="art"><img id="art" alt="lode" /></div>

  <div class="row"><span>supply</span><b id="supply">—</b></div>
  <div class="row"><span>price (after your free piece)</span><b id="price">—</b></div>
  <div class="row"><span>your quota</span><b id="quota">—</b></div>
  <div class="row"><span>gate</span><b id="gate">—</b></div>

  <button id="mint" disabled>connect wallet</button>
  <div class="msg" id="msg"></div>
</div>

<div class="card" style="margin-top:18px">
  <h1 style="font-size:16px">Market</h1>
  <div class="sub">on-chain listings · 2% fee goes to the treasury</div>

  <div class="row"><span>token id</span><input id="tid" value="1" style="width:90px;background:#0b0e11;border:1px solid #232a33;color:#e8e6e1;padding:4px 6px;border-radius:6px" /></div>
  <div class="row"><span>ask</span><b id="ask">—</b></div>
  <div class="row"><span>seller</span><b id="seller">—</b></div>
  <button id="buy" disabled>buy</button>

  <div class="row"><span>list price (BNB)</span><input id="lprice" value="0.01" style="width:100px;background:#0b0e11;border:1px solid #232a33;color:#e8e6e1;padding:4px 6px;border-radius:6px" /></div>
  <div class="row"><span>days</span><input id="ldays" value="7" style="width:60px;background:#0b0e11;border:1px solid #232a33;color:#e8e6e1;padding:4px 6px;border-radius:6px" /></div>
  <button id="approve">1 · approve piece</button>
  <button id="list">2 · list piece</button>
  <div class="msg" id="mmsg"></div>
</div>

<script type="module">
// Ganti dua nilai ini setelah deploy:
const CONTRACT = "0x31b074C8e77e44F29df285F19d4fc76E6D927d01";
const MARKET = "0xf607c6aD07c173056B7D4D63d0c9d26Ad9D3f4E2";
const EXPLORER = "https://bscscan.com/address/";

const ABI = [
  "function totalMinted() view returns (uint256)",
  "function pending(uint256) view returns (uint256)",
  "function claim(uint256)",
  "function forge(uint256[3]) returns (uint256)",
  "function MAX_SUPPLY() view returns (uint256)",
  "function priceWei() view returns (uint256)",
  "function MAX_PER_WALLET() view returns (uint256)",
  "function mintedBy(address) view returns (uint256)",
  "function agentRegistry() view returns (address)",
  "function tokenURI(uint256) view returns (string)",
  "function mint(uint256 quantity) payable",
];
const REG_ABI = ["function balanceOf(address) view returns (uint256)"];

const $ = (id) => document.getElementById(id);
let provider, signer, account, contract;

async function initEthers() {
  if (!window.ethereum) throw new Error("a browser wallet is required (MetaMask/Rabby)");
  const { ethers } = await import("https://esm.sh/ethers@6");
  provider = new ethers.BrowserProvider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  signer = await provider.getSigner();
  account = await signer.getAddress();
  contract = new ethers.Contract(CONTRACT, ABI, signer);
  return ethers;
}

async function refresh(ethers) {
  const [total, max, price, perWallet, mine, reg] = await Promise.all([
    contract.totalMinted(), contract.MAX_SUPPLY(), contract.priceWei(),
    contract.MAX_PER_WALLET(), contract.mintedBy(account), contract.agentRegistry(),
  ]);
  $("supply").textContent = `${total} / ${max}`;
  $("price").textContent = `${ethers.formatEther(price)} BNB`;
  $("quota").textContent = `${mine} / ${perWallet}`;
  const registry = new ethers.Contract(reg, REG_ABI, provider);
  const bal = await registry.balanceOf(account);
  $("gate").textContent = bal > 0n ? "Agent ID ✓" : "not an .ai holder";
  $("mint").disabled = bal === 0n || total >= max;
  $("mint").textContent = bal === 0n ? "this wallet has no Agent ID" : "mint 1";

  // preview art from the latest piece (or #1)
  const id = total > 0n ? total : 1n;
  try {
    const uri = await contract.tokenURI(id);
    const json = JSON.parse(atob(uri.split(",")[1]));
    $("art").src = json.image;
  } catch {}
}

$("mint").addEventListener("click", async () => {
  try {
    $("msg").textContent = "preparing the transaction…";
    const ethers = await initEthers();
    const mine = await contract.mintedBy(account);
    const price = await contract.priceWei();
    const value = mine === 0n ? 0n : price; // first piece is free
    const tx = await contract.mint(1, { value });
    $("msg").textContent = "tx sent: " + tx.hash;
    await tx.wait();
    $("msg").textContent = "confirmed ✓ " + tx.hash;
    await refresh(ethers);
  } catch (e) {
    $("msg").textContent = "failed: " + (e.shortMessage || e.message || e);
  }
});


// ---------------- market ----------------
const MARKET_ABI = [
  "function listing(uint256) view returns (address seller, uint96 price, uint64 expiry)",
  "function quote(uint256) view returns (uint256 price, uint256 fee, address seller, uint64 expiry)",
  "function FEE_BPS() view returns (uint256)",
  "function list(uint256 tokenId, uint256 price, uint64 durationDays)",
  "function cancel(uint256 tokenId)",
  "function buy(uint256 tokenId) payable",
];
const LODE_EXTRA = [
  "function approve(address to, uint256 tokenId)",
  "function getApproved(uint256) view returns (address)",
  "function ownerOf(uint256) view returns (address)",
];
let marketC, lodeC, ethersLib;

async function marketInit() {
  const ethers = await initEthers();
  ethersLib = ethers;
  marketC = new ethers.Contract(MARKET, MARKET_ABI, signer);
  lodeC = new ethers.Contract(CONTRACT, LODE_EXTRA, signer);
  return ethers;
}

async function checkListing() {
  try {
    if (!marketC) await marketInit();
    const id = BigInt($("tid").value || "0");
    const l = await marketC.listing(id);
    if (!l.seller || l.seller === ethersLib.ZeroAddress) {
      $("ask").textContent = "not listed";
      $("seller").textContent = "—";
      $("buy").disabled = true;
      return;
    }
    const expired = Number(l.expiry) * 1000 < Date.now();
    $("ask").textContent = `${ethersLib.formatEther(l.price)} BNB${expired ? " (expired)" : ""}`;
    $("seller").textContent = l.seller.slice(0, 10) + "…";
    $("buy").disabled = expired || l.seller.toLowerCase() === account.toLowerCase();
  } catch (e) {
    $("mmsg").textContent = "check failed: " + (e.shortMessage || e.message);
  }
}

$("tid").addEventListener("change", checkListing);

$("buy").addEventListener("click", async () => {
  try {
    $("mmsg").textContent = "preparing buy…";
    if (!marketC) await marketInit();
    const id = BigInt($("tid").value || "0");
    const q = await marketC.quote(id);
    const tx = await marketC.buy(id, { value: q.price });
    $("mmsg").textContent = "tx sent: " + tx.hash;
    await tx.wait();
    $("mmsg").textContent = "bought ✓ " + tx.hash;
    await checkListing();
  } catch (e) {
    $("mmsg").textContent = "buy failed: " + (e.shortMessage || e.message);
  }
});

$("approve").addEventListener("click", async () => {
  try {
    $("mmsg").textContent = "approving one piece…";
    if (!lodeC) await marketInit();
    const id = BigInt($("tid").value || "0");
    const tx = await lodeC.approve(MARKET, id);
    await tx.wait();
    $("mmsg").textContent = "approved ✓ " + tx.hash + " — now press list";
  } catch (e) {
    $("mmsg").textContent = "approve failed: " + (e.shortMessage || e.message);
  }
});

$("list").addEventListener("click", async () => {
  try {
    $("mmsg").textContent = "listing…";
    if (!marketC) await marketInit();
    const id = BigInt($("tid").value || "0");
    const price = ethersLib.parseEther(String($("lprice").value || "0"));
    const days = BigInt($("ldays").value || "7");
    const tx = await marketC.list(id, price, days);
    await tx.wait();
    $("mmsg").textContent = "listed ✓ " + tx.hash;
    await checkListing();
  } catch (e) {
    $("mmsg").textContent = "list failed: " + (e.shortMessage || e.message);
  }
});

(async () => {
  try {
    if (CONTRACT === "0x0000000000000000000000000000000000000000") {
      $("msg").innerHTML = "contract not deployed yet - set <code>CONTRACT</code> in this file.";
      return;
    }
    const ethers = await initEthers();
    $("mint").textContent = "mint 1";
    await refresh(ethers);
    await checkListing();
  } catch (e) {
    $("msg").textContent = e.message;
  }
})();
</script>
</body>
</html>
