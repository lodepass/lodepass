<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lodepass - mining pass for .ai agents</title>
<style>
  :root { --ink:#e8e6e1; --dim:#8b929c; --line:#232a33; --gold:#f5c76a; --bg:#0b0e11; --panel:#0f1318; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font:15px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
         padding:16px; display:flex; justify-content:center; }
  .wrap { width:100%; max-width:520px; }
  .card { border:1px solid var(--line); border-radius:16px; padding:18px; background:var(--panel); margin-bottom:14px; }
  h1 { font-size:18px; letter-spacing:.16em; text-transform:uppercase; }
  h2 { font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); }
  .sub { color:var(--dim); font-size:12px; margin-top:6px; line-height:1.5; }
  .art { display:grid; place-items:center; margin:14px 0; }
  .art img { width:min(190px,58vw); border-radius:12px; border:1px solid var(--line); }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0;
         border-bottom:1px solid var(--line); font-size:13px; }
  .row:last-of-type { border-bottom:none; }
  .row b { color:var(--gold); font-weight:600; text-align:right; word-break:break-word; }
  input { background:#0b0e11; border:1px solid var(--line); color:var(--ink); font:inherit;
          padding:6px 8px; border-radius:8px; width:110px; text-align:right; }
  button { width:100%; margin-top:10px; padding:12px; border-radius:11px; border:1px solid var(--gold);
           background:transparent; color:var(--gold); font:inherit; letter-spacing:.05em; cursor:pointer; }
  button:hover:not(:disabled) { background:rgba(245,199,106,.08); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .msg { margin-top:9px; font-size:12px; color:var(--dim); min-height:15px; word-break:break-word; }
  .note { font-size:11.5px; color:var(--dim); margin-top:8px; line-height:1.5; }
  a { color:var(--gold); }
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <h1>Lodepass</h1>
    <div class="sub">On-chain mining pass · mint is limited to Binance Agent ID (.ai) holders</div>

    <div class="art"><img id="art" alt="piece" /></div>

    <div class="row"><span>supply</span><b id="supply">—</b></div>
    <div class="row"><span>price (after your free piece)</span><b id="price">—</b></div>
    <div class="row"><span>your quota</span><b id="quota">—</b></div>
    <div class="row"><span>gate</span><b id="gate">—</b></div>
    <div class="row"><span>floor</span><b id="floor">—</b></div>

    <button id="connect">connect wallet</button>
    <button id="mint" disabled>mint 1</button>
    <div class="msg" id="msg"></div>
    <div class="note" id="walletNote"></div>
  </div>

  <div class="card">
    <h2>Market</h2>
    <div class="sub" style="margin-bottom:8px">on-chain listings · 2% fee to the treasury</div>

    <div class="row"><span>token id</span><input id="tid" value="1" /></div>
    <div class="row"><span>ask</span><b id="ask">—</b></div>
    <div class="row"><span>seller</span><b id="seller">—</b></div>
    <button id="buy" disabled>buy</button>

    <div class="row"><span>list price (BNB)</span><input id="lprice" value="0.01" /></div>
    <div class="row"><span>days</span><input id="ldays" value="7" /></div>
    <button id="approve" disabled>1 · approve piece</button>
    <button id="list" disabled>2 · list piece</button>
    <div class="msg" id="mmsg"></div>
  </div>

</div>

<script type="module">
const CONTRACT = "0x31b074C8e77e44F29df285F19d4fc76E6D927d01";
const MARKET   = "0xf607c6aD07c173056B7D4D63d0c9d26Ad9D3f4E2";
const RPC      = "https://bsc-dataseed.bnbchain.org";
const ZERO     = "0x0000000000000000000000000000000000000000";

const LODE_ABI = [
  "function totalMinted() view returns (uint256)",
  "function MAX_SUPPLY() view returns (uint256)",
  "function priceWei() view returns (uint256)",
  "function MAX_PER_WALLET() view returns (uint256)",
  "function mintedBy(address) view returns (uint256)",
  "function freeUsed(address) view returns (uint256)",
  "function agentRegistry() view returns (address)",
  "function tokenURI(uint256) view returns (string)",
  "function approve(address to, uint256 tokenId)",
  "function mint(uint256 quantity) payable",
];
const MARKET_ABI = [
  "function listing(uint256) view returns (address seller, uint96 price, uint64 expiry)",
  "function quote(uint256) view returns (uint256 price, uint256 fee, address seller, uint64 expiry)",
  "function buy(uint256 tokenId) payable",
  "function list(uint256 tokenId, uint256 price, uint64 durationDays)",
];
const REG_ABI = ["function balanceOf(address) view returns (uint256)"];

const $ = (id) => document.getElementById(id);
let E, provider, signer, account, lode, market, roLode, roMarket;

const setMsg = (t) => ($("msg").textContent = t);
const setMkt = (t) => ($("mmsg").textContent = t);

async function lib() {
  if (!E) E = await import("https://esm.sh/ethers@6");
  return E;
}

async function readOnly() {
  if (roLode) return;
  const e = await lib();
  const p = new e.JsonRpcProvider(RPC, 56, { staticNetwork: true });
  roLode = new e.Contract(CONTRACT, LODE_ABI, p);
  roMarket = new e.Contract(MARKET, MARKET_ABI, p);
}

async function refreshPublic() {
  const e = await lib();
  await readOnly();
  const [total, max, price] = await Promise.all([roLode.totalMinted(), roLode.MAX_SUPPLY(), roLode.priceWei()]);
  $("supply").textContent = `${total} / ${max}`;
  $("price").textContent = `${e.formatEther(price)} BNB`;
  try {
    const uri = await roLode.tokenURI(total > 0n ? total : 1n);
    $("art").src = JSON.parse(atob(uri.split(",")[1])).image;
  } catch {}
  try {
    const l = await roMarket.listing(1);
    $("floor").textContent = (!l.seller || l.seller === ZERO) ? "no listing yet" : `${e.formatEther(l.price)} BNB (#1)`;
  } catch { $("floor").textContent = "—"; }
}

async function connect() {
  if (typeof window.ethereum === "undefined") {
    $("walletNote").innerHTML =
      "No browser wallet on this page. Open it inside your wallet app's browser (MetaMask, Rabby, Trust, Binance), or import the contract in your wallet: <b>" + CONTRACT + "</b>";
    setMsg("read-only mode");
    return;
  }
  const e = await lib();
  provider = new e.BrowserProvider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  signer = await provider.getSigner();
  account = await signer.getAddress();
  lode = new e.Contract(CONTRACT, LODE_ABI, signer);
  market = new e.Contract(MARKET, MARKET_ABI, signer);
  $("connect").textContent = account.slice(0, 6) + "…" + account.slice(-4);
  $("approve").disabled = false;
  $("list").disabled = false;
  $("walletNote").textContent = "";
  await refreshAccount();
}

async function refreshAccount() {
  const e = await lib();
  await readOnly();
  const [perWallet, mine, reg, price, freeUsed] = await Promise.all([
    roLode.MAX_PER_WALLET(), roLode.mintedBy(account), roLode.agentRegistry(),
    roLode.priceWei(), roLode.freeUsed(account),
  ]);
  $("quota").textContent = `${mine} / ${perWallet}`;
  const registry = new e.Contract(reg, REG_ABI, provider);
  const bal = await registry.balanceOf(account);
  const isAgent = bal > 0n;
  $("gate").textContent = isAgent ? "Agent ID ✓" : "not an .ai holder";
  $("mint").disabled = !isAgent;
  $("mint").textContent = !isAgent ? "this wallet has no Agent ID"
    : freeUsed === 0n ? "mint 1 (free)" : `mint 1 (${e.formatEther(price)} BNB)`;
  await checkListing();
}

async function checkListing() {
  try {
    const e = await lib();
    await readOnly();
    const id = BigInt($("tid").value || "0");
    const l = await roMarket.listing(id);
    if (!l.seller || l.seller === ZERO) {
      $("ask").textContent = "not listed";
      $("seller").textContent = "—";
      $("buy").disabled = true;
      return;
    }
    const expired = Number(l.expiry) * 1000 < Date.now();
    $("ask").textContent = `${e.formatEther(l.price)} BNB${expired ? " (expired)" : ""}`;
    $("seller").textContent = l.seller.slice(0, 8) + "…" + l.seller.slice(-4);
    const mine = account && l.seller.toLowerCase() === account.toLowerCase();
    $("buy").disabled = expired || mine || !account;
    $("buy").textContent = mine ? "your listing" : "buy";
  } catch (err) { setMkt("check failed: " + (err.shortMessage || err.message)); }
}

$("connect").addEventListener("click", async () => {
  try { await connect(); } catch (err) { setMsg("connect failed: " + (err.shortMessage || err.message)); }
});
$("tid").addEventListener("change", () => checkListing());

$("mint").addEventListener("click", async () => {
  try {
    if (!signer) return setMsg("connect a wallet first");
    const e = await lib();
    setMsg("preparing…");
    const freeUsed = await roLode.freeUsed(account);
    const price = await roLode.priceWei();
    const tx = await lode.mint(1, { value: freeUsed === 0n ? 0n : price });
    setMsg("tx sent: " + tx.hash);
    await tx.wait();
    setMsg("confirmed ✓ " + tx.hash);
    await refreshPublic();
    await refreshAccount();
  } catch (err) { setMsg("failed: " + (err.shortMessage || err.message)); }
});

$("buy").addEventListener("click", async () => {
  try {
    if (!signer) return setMkt("connect a wallet first");
    setMkt("preparing buy…");
    const id = BigInt($("tid").value || "0");
    const q = await market.quote(id);
    const tx = await market.buy(id, { value: q.price });
    setMkt("tx sent: " + tx.hash);
    await tx.wait();
    setMkt("bought ✓ " + tx.hash);
    await checkListing();
    await refreshPublic();
  } catch (err) { setMkt("buy failed: " + (err.shortMessage || err.message)); }
});

$("approve").addEventListener("click", async () => {
  try {
    if (!signer) return setMkt("connect a wallet first");
    setMkt("approving one piece…");
    const id = BigInt($("tid").value || "0");
    const tx = await lode.approve(MARKET, id);
    await tx.wait();
    setMkt("approved ✓ now press 2 · list piece");
  } catch (err) { setMkt("approve failed: " + (err.shortMessage || err.message)); }
});

$("list").addEventListener("click", async () => {
  try {
    if (!signer) return setMkt("connect a wallet first");
    const e = await lib();
    setMkt("listing…");
    const id = BigInt($("tid").value || "0");
    const price = e.parseEther(String($("lprice").value || "0"));
    const days = BigInt($("ldays").value || "7");
    const tx = await market.list(id, price, days);
    await tx.wait();
    setMkt("listed ✓ " + tx.hash);
    await checkListing();
    await refreshPublic();
  } catch (err) { setMkt("list failed: " + (err.shortMessage || err.message)); }
});

(async () => {
  if (typeof window.ethereum === "undefined") {
    $("walletNote").textContent = "No browser wallet here, so the page is read-only. Open it in your wallet app to mint or trade.";
  }
  try {
    await refreshPublic();
    await checkListing();
  } catch (err) { setMsg("could not read chain: " + (err.shortMessage || err.message)); }
})();
</script>
</body>
</html>
